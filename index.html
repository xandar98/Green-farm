    function drawFruitTree(wx, wy, tile, now, t) {
        const def = TREES[tile.id];
        const ready = now >= tile.readyAt;
        const sway = Math.sin(t * 2 + wx * 0.08) * 2.2;

        ctx.save();
        ctx.translate(wx, wy);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath(); ctx.ellipse(3, 5, 22, 10, 0, 0, Math.PI * 2); ctx.fill();

        // Trunk
        ctx.fillStyle = '#7c471b';
        ctx.beginPath();
        ctx.moveTo(-6, 4); ctx.lineTo(6, 4); ctx.lineTo(4, -24); ctx.lineTo(-4, -24);
        ctx.closePath();
        ctx.fill();

        // Canopy
        ctx.fillStyle = '#2d8623';
        ctx.beginPath(); ctx.arc(sway * 0.5, -34, 21, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#47b82f';
        ctx.beginPath(); ctx.arc(-9 + sway, -40, 15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(9 + sway, -38, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6ed645';
        ctx.beginPath(); ctx.arc(sway, -48, 13, 0, Math.PI * 2); ctx.fill();

        // Hanging fruits when ready
        if (ready) {
            ctx.fillStyle = tile.id === 'apple_tree' ? '#ef4444' : '#fb923c';
            [[-10, -38], [8, -42], [-1, -28], [11, -30], [-12, -29]].forEach(([fx, fy]) => {
                ctx.beginPath(); ctx.arc(fx + sway, fy, 4.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath(); ctx.arc(fx + sway - 1.2, fy - 1.2, 1.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = tile.id === 'apple_tree' ? '#ef4444' : '#fb923c';
            });
        }
        ctx.restore();

        if (ready) {
            drawFloatingBadge(wx, wy - 68, def.icon, '#fef08a', '#b45309', t);
        }
    }

    function drawMachine(wx, wy, tile, now, t) {
        const def = MACHINES[tile.id];
        const working = tile.recipe && now < tile.readyAt;
        const ready = tile.recipe && now >= tile.readyAt;
        const bounce = working ? Math.sin(t * 10) * 1.6 : 0;

        ctx.save();
        ctx.translate(wx, wy + bounce);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        drawDiamond(0, 4, TILE_W - 8, TILE_H - 4);
        ctx.fill();

        if (tile.id === 'bakery') {
            // Warm stone & brick bakery mill
            ctx.fillStyle = '#f5deb3';
            ctx.beginPath();
            ctx.moveTo(-28, 2); ctx.lineTo(0, 16); ctx.lineTo(0, -24); ctx.lineTo(-28, -38);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#7c471b'; ctx.lineWidth = 1.8; ctx.stroke();

            ctx.fillStyle = '#dec08c';
            ctx.beginPath();
            ctx.moveTo(0, 16); ctx.lineTo(28, 2); ctx.lineTo(28, -38); ctx.lineTo(0, -24);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // Glowing brick oven arch
            ctx.fillStyle = working ? '#fb923c' : '#572a13';
            ctx.beginPath(); ctx.arc(-14, -4, 7, Math.PI, 0); ctx.lineTo(-7, 6); ctx.lineTo(-21, -1); ctx.closePath(); ctx.fill();

            // Warm terracotta roof
            ctx.fillStyle = '#d9532f';
            ctx.beginPath();
            ctx.moveTo(-34, -36); ctx.lineTo(0, -18); ctx.lineTo(34, -36); ctx.lineTo(0, -58);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#7c2210'; ctx.stroke();

            // Chimney + steam when baking
            ctx.fillStyle = '#a83c24';
            ctx.fillRect(8, -64, 10, 20);
            if (working) {
                const puffY = -68 - ((t * 25) % 18);
                ctx.fillStyle = `rgba(255,255,255,${1 - ((t * 25) % 18) / 18})`;
                ctx.beginPath(); ctx.arc(13, puffY, 5, 0, Math.PI * 2); ctx.fill();
            }
        } else {
            // Dairy Press building (blue & cream farmhouse style)
            ctx.fillStyle = '#eff6ff';
            ctx.beginPath();
            ctx.moveTo(-28, 2); ctx.lineTo(0, 16); ctx.lineTo(0, -22); ctx.lineTo(-28, -36);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#1e40af'; ctx.lineWidth = 1.8; ctx.stroke();

            ctx.fillStyle = '#dbeafe';
            ctx.beginPath();
            ctx.moveTo(0, 16); ctx.lineTo(28, 2); ctx.lineTo(28, -36); ctx.lineTo(0, -22);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // Blue roof
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.moveTo(-34, -34); ctx.lineTo(0, -16); ctx.lineTo(34, -34); ctx.lineTo(0, -56);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#1e3a8a'; ctx.stroke();

            // Golden cheese press wheel on side
            ctx.save();
            ctx.translate(14, -10);
            if (working) ctx.rotate(t * 3);
            ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
            ctx.restore();
        }
        ctx.restore();

        if (ready) {
            const rec = def.recipes.find(r => r.id === tile.recipe);
            drawFloatingBadge(wx, wy - 70, rec ? rec.icon : '✨', '#fef08a', '#b45309', t);
        } else if (working) {
            // Small compact progress pill above working machine
            const prog = Math.min(1, (now - tile.startedAt) / Math.max(1, tile.readyAt - tile.startedAt));
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(wx - 22, wy - 68, 44, 7);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(wx - 21, wy - 67, 42 * prog, 5);
        }
    }

    function drawDecor(wx, wy, tile, t) {
        ctx.save();
        ctx.translate(wx, wy);
        if (tile.id === 'flower_bed') {
            drawDiamond(0, 0, 56, 28);
            ctx.fillStyle = '#7c471b'; ctx.fill();
            drawDiamond(0, -2, 48, 24);
            ctx.fillStyle = '#3f9128'; ctx.fill();
            const cols = ['#f43f5e', '#facc15', '#ec4899', '#a855f7', '#fb923c'];
            [[-12, -2], [0, -7], [12, -2], [-4, 3], [6, 3]].forEach(([fx, fy], i) => {
                ctx.fillStyle = cols[i];
                ctx.beginPath(); ctx.arc(fx, fy - 4 + Math.sin(t * 2 + i) * 1, 4.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fef08a';
                ctx.beginPath(); ctx.arc(fx, fy - 4 + Math.sin(t * 2 + i) * 1, 1.5, 0, Math.PI * 2); ctx.fill();
            });
        } else if (tile.id === 'hay_bale') {
            const drawBale = (bx, by) => {
                ctx.fillStyle = '#eab308';
                ctx.strokeStyle = '#a16207'; ctx.lineWidth = 1.5;
                ctx.fillRect(bx - 13, by - 10, 26, 13);
                ctx.strokeRect(bx - 13, by - 10, 26, 13);
                ctx.fillStyle = '#fde047';
                ctx.fillRect(bx - 13, by - 14, 26, 5);
                ctx.strokeStyle = '#92400e';
                ctx.beginPath(); ctx.moveTo(bx - 5, by - 14); ctx.lineTo(bx - 5, by + 3); ctx.moveTo(bx + 5, by - 14); ctx.lineTo(bx + 5, by + 3); ctx.stroke();
            };
            drawBale(-8, 4);
            drawBale(10, 5);
            drawBale(1, -8);
        } else if (tile.id === 'well') {
            ctx.fillStyle = '#94a3b8';
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.ellipse(0, 2, 16, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillRect(-16, -12, 32, 14);
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.ellipse(0, -12, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#6b3e17'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(-13, -12); ctx.lineTo(-13, -36); ctx.moveTo(13, -12); ctx.lineTo(13, -36); ctx.stroke();
            ctx.fillStyle = '#b91c1c';
            ctx.beginPath(); ctx.moveTo(-20, -34); ctx.lineTo(20, -34); ctx.lineTo(0, -50); ctx.closePath(); ctx.fill();
        } else if (tile.id === 'scarecrow') {
            const tilt = Math.sin(t * 2) * 0.06;
            ctx.rotate(tilt);
            ctx.strokeStyle = '#78350f'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -34); ctx.moveTo(-16, -22); ctx.lineTo(16, -22); ctx.stroke();
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(-7, -26, 14, 15);
            ctx.fillStyle = '#fde68a';
            ctx.beginPath(); ctx.arc(0, -34, 7, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ca8a04';
            ctx.beginPath(); ctx.ellipse(0, -40, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-7, -40); ctx.lineTo(7, -40); ctx.lineTo(0, -50); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }

    function drawFloatingBadge(x, y, icon, bgColor, borderColor, t, speechTail = false) {
        const bob = Math.sin(t * 4.5 + x * 0.04) * 4;
        const by = y + bob;
        ctx.save();
        ctx.fillStyle = bgColor;
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(x, by, 13.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (speechTail) {
            ctx.beginPath();
            ctx.moveTo(x - 4, by + 12);
            ctx.lineTo(x + 4, by + 12);
            ctx.lineTo(x, by + 18);
            ctx.closePath();
            ctx.fill();
        }

        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x, by + 1);
        ctx.restore();
    }

    /* ============================================================================
       12. MAIN 60FPS ANIMATION LOOP
       ============================================================================ */
    let lastSaveTick = 0;
    let lastUiTick = 0;

    function tickAndRender(timestamp) {
        const t = timestamp / 1000;
        const now = Date.now();

        // 1. Energy auto-regeneration (1 energy every 10 seconds)
        if (state.energy < MAX_ENERGY) {
            const elapsed = now - state.lastEnergyTime;
            if (elapsed >= ENERGY_REGEN_MS) {
                const gained = Math.floor(elapsed / ENERGY_REGEN_MS);
                state.energy = Math.min(MAX_ENERGY, state.energy + gained);
                state.lastEnergyTime += gained * ENERGY_REGEN_MS;
                updateHUD();
            }
            const timerEl = document.getElementById('hud-energy-timer');
            if (state.energy < MAX_ENERGY) {
                const rem = Math.ceil((ENERGY_REGEN_MS - (now - state.lastEnergyTime)) / 1000);
                timerEl.textContent = `(${rem}s)`;
                timerEl.classList.remove('hidden');
            } else {
                timerEl.classList.add('hidden');
            }
        } else {
            document.getElementById('hud-energy-timer').classList.add('hidden');
        }

        // 2. Smooth camera easing
        cam.x += (cam.targetX - cam.x) * 0.16;
        cam.y += (cam.targetY - cam.y) * 0.16;
        cam.zoom += (cam.targetZoom - cam.zoom) * 0.16;

        // 3. Periodic inspect ring update & auto-save
        if (now - lastUiTick > 250) {
            lastUiTick = now;
            if (inspectedTile) updateInspectPopup();
        }
        if (now - lastSaveTick > 5000) {
            lastSaveTick = now;
            saveState();
        }

        // 4. Begin Canvas Frame
        ctx.save();
        ctx.scale(dpr, dpr);
        drawBackgroundMeadow();

        // Transform into World Space
        ctx.translate(viewW / 2, viewH / 2);
        ctx.scale(cam.zoom, cam.zoom);
        ctx.translate(-cam.x, -cam.y);

        // Background non-grid scenery
        drawDirtRoadsAndFarmBase();
        drawSparklingPond(t);
        drawWindmill(t);
        drawFarmhouse(t);
        drawClassicRedBarn();

        // Back perimeter trees
        [[-3, -0.5, 1.1], [-1.8, -1.5, 0.9], [1.2, -2.2, 1.0], [5.8, -2.0, 1.05], [8.5, -1.8, 0.95], [-2.2, 5.5, 1.1], [-1.8, 9.2, 1.0]].forEach(([tx, ty, sc], i) => {
            const p = gridToWorld(tx, ty);
            drawSceneryTree(p.x, p.y, t, sc, i * 1.3);
        });

        drawPerimeterFences(true);

        // 5. Render 14x14 Isometric Grid in Back-to-Front Painter's Order
        for (let gy = 0; gy < GRID_SIZE; gy++) {
            for (let gx = 0; gx < GRID_SIZE; gx++) {
                const tile = state.grid[gy][gx];
                const { x, y } = gridToWorld(gx, gy);

                // Always draw base grass under everything
                drawGrassTile(x, y, gx, gy);

                // Placement / Mode Highlight Preview
                if (hoveredTile && hoveredTile.gx === gx && hoveredTile.gy === gy && currentMode !== 'hand') {
                    let valid = false;
                    if (currentMode === 'plow' || currentMode === 'build') valid = tile.type === 'grass';
                    if (currentMode === 'plant') valid = tile.type === 'plot' && !tile.crop;
                    drawDiamond(x, y, TILE_W - 2, TILE_H - 2);
                    ctx.fillStyle = valid ? 'rgba(74, 222, 128, 0.45)' : 'rgba(248, 113, 113, 0.45)';
                    ctx.fill();
                    ctx.strokeStyle = valid ? '#16a34a' : '#dc2626';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }

                if (tile.type === 'plot') {
                    drawPlowedPlot(x, y, tile, now, t);
                } else if (tile.type === 'animal') {
                    drawAnimal(x, y, tile, now, t);
                } else if (tile.type === 'tree') {
                    drawFruitTree(x, y, tile, now, t);
                } else if (tile.type === 'machine') {
                    drawMachine(x, y, tile, now, t);
                } else if (tile.type === 'decor') {
                    drawDecor(x, y, tile, t);
                }
            }
        }

        // Front fences & foreground trees
        drawPerimeterFences(false);
        [[14.8, 2.2, 1.0], [14.8, 11.2, 1.15], [3.5, 14.9, 1.05], [10.8, 14.8, 0.95]].forEach(([tx, ty, sc], i) => {
            const p = gridToWorld(tx, ty);
            drawSceneryTree(p.x, p.y, t, sc, i * 2.1 + 5);
        });

        // Chimney smoke puffs
        for (let i = smokePuffs.length - 1; i >= 0; i--) {
            const sp = smokePuffs[i];
            sp.y -= 0.35;
            sp.x += 0.2;
            sp.r += 0.12;
            sp.life -= 0.012;
            if (sp.life <= 0) { smokePuffs.splice(i, 1); continue; }
            ctx.fillStyle = `rgba(255,255,255,${sp.life * 0.55})`;
            ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
        }

        // Particles (Coins, Stars, Dirt)
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.12;
            p.life -= p.decay;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Floating "+Coins / +XP" popups
        for (let i = popups.length - 1; i >= 0; i--) {
            const pop = popups[i];
            pop.y -= 0.75;
            pop.life -= 0.016;
            if (pop.life <= 0) { popups.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = Math.min(1, pop.life * 1.4);
            ctx.font = 'bold 16px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(42, 20, 5, 0.85)';
            ctx.strokeText(pop.text, pop.x, pop.y);
            ctx.fillStyle = pop.color;
            ctx.fillText(pop.text, pop.x, pop.y);
            ctx.restore();
        }

        // Soft drifting clouds
        clouds.forEach(cl => {
            cl.x += cl.speed;
            if (cl.x > 850) cl.x = -850;
            ctx.save();
            ctx.translate(cl.x, cl.y);
            ctx.scale(cl.scale, cl.scale);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.beginPath();
            ctx.arc(0, 0, 38, 0, Math.PI * 2);
            ctx.arc(34, -8, 30, 0, Math.PI * 2);
            ctx.arc(-32, -4, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        ctx.restore();
        requestAnimationFrame(tickAndRender);
    }

    /* ============================================================================
       13. BOOTSTRAP
       ============================================================================ */
    window.addEventListener('resize', resizeCanvas);
    window.onload = function () {
        resizeCanvas();
        loadState();
        initAmbientEffects();
        centerCamera();
        // Snap camera immediately on first boot
        cam.x = cam.targetX;
        cam.y = cam.targetY;
        cam.zoom = cam.targetZoom;
        updateHUD();
        requestAnimationFrame(tickAndRender);
        setTimeout(() => showToast('🌾 Tap the ripe Wheat plots to harvest!', 'success'), 500);
    };
    </script>
</body>
</html>
